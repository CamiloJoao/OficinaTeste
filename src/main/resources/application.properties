spring.application.name=oficina
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/oficina
spring.datasource.username=postgres
spring.datasource.password=roots
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Usuários iniciais (criados pela classe UsuariosIniciais). As senhas ficam guardadas só como hash BCrypt.
oficina.admin.email=admin@oficina.com
oficina.admin.senha-hash=$2a$10$mh4qwbweKKiEkqMWRs/I0uUEdpCh6oPnekLqCSyhhn5iwdj8EA3AC
oficina.funcionario.email=funcionario@oficina.com
oficina.funcionario.senha-hash=$2a$10$Z2IfvnApBhU9TnuTncZk4OLKRYFypMwgYFrbL/vpmmqdc4DO7xMUu

# Apoio ao diagnóstico (Gemini API). A chave vem só da variável de ambiente GEMINI_API_KEY.
oficina.ia.chave=${GEMINI_API_KEY:}
oficina.ia.modelo=gemini-3.8-flash
oficina.ia.tempo-limite-segundos=120
# false no plano gratuito, que não libera a pesquisa no Google
oficina.ia.pesquisa=false
