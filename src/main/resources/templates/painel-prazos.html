<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="conteudo">
        <a class="btn-voltar" th:href="@{/}">&larr; Voltar</a>

    <h1 th:text="'Serviços - ' + (${tipoSelecionado == 'prioritario'} ? 'Prioritários' : (${tipoSelecionado == 'proximo'} ? 'Próximos' : 'No prazo'))">
        Serviços
    </h1>

    <div class="conteudo centralizado">
        <div class="descricaoBox descricaoBox-tabela">

            <!-- BOTÕES DE FILTRO -->
            <div class="grid-badges" style="margin-bottom: 24px;">
                <a href="/painel/prazos?tipo=prioritario"
                   class="badge vermelho"
                   th:classappend="${tipoSelecionado == 'prioritario'} ? 'badge-ativo' : ''">
                    Prioritários
                </a>
                <a href="/painel/prazos?tipo=proximo"
                   class="badge amarelo"
                   th:classappend="${tipoSelecionado == 'proximo'} ? 'badge-ativo' : ''">
                    Próximos
                </a>
                <a href="/painel/prazos?tipo=normal"
                   class="badge verde"
                   th:classappend="${tipoSelecionado == 'normal'} ? 'badge-ativo' : ''">
                    No prazo
                </a>
            </div>

            <!-- TABELA -->
            <div class="boxtable">

                <table>
                    <tr>
                        <th>Cliente</th>
                        <th>Tipo</th>
                        <th>Data prevista de conclusão</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>

                    <tr th:if="${#lists.isEmpty(servicos)}">
                        <td colspan="5">Nenhum serviço encontrado</td>
                    </tr>

                    <tr th:each="s : ${servicos}">
                        <td th:text="${s.cliente.nomeCliente}"></td>
                        <td th:text="${s.tipoServico}"></td>

                        <!-- FORMATAR DATA -->
                        <td th:text="${#temporals.format(s.dataPrevistaConclusao, 'dd/MM/yyyy')}"></td>

                        <td th:text="${s.status}"></td>

                        <td class="nowrap">
                            <a th:href="@{'/statusdeservico/detalhes/' + ${s.idServico}}">
                                Ver detalhes
                            </a>
                        </td>
                    </tr>

                </table>
            </div>
        </div>    
    </div>    

</div>

</body>
</html>
