<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oficina</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="fragments/menu :: menu"></div>

    <div class="conteudo conteudo-principal">

        <div class="relogio">
            <span class="relogio-data" id="relogio-data"></span>
            <span class="relogio-hora" id="relogio-hora"></span>
        </div>

        <div th:replace="~{${pagina} :: conteudo}"></div>
    </div>

    <script>
    (function () {
        const dias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

        function atualizarRelogio() {
            const agora = new Date();

            const data = dias[agora.getDay()] + ", " + agora.toLocaleDateString("pt-BR");
            const hora = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

            document.getElementById("relogio-data").textContent = data;
            document.getElementById("relogio-hora").textContent = hora;
        }

        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);
    })();
    </script>

    <script th:src="@{/js/busca-peca.js}"></script>

</body>
</html>
