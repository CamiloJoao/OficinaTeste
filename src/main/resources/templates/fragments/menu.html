<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div th:fragment="menu" class="menu">
        <h2>Oficina</h2>

        <a href="/"
            th:classappend="${pagina == 'painelgeral'} ? 'ativo'">
            Painel Geral
        </a>

        <a href="/gerenciarclientes"
            th:classappend="${pagina == 'gerenciarclientes'} ? 'ativo'">
            Gerenciar Cliente
        </a>

        <a href="/manutencao"
            th:classappend="${pagina == 'manutencao'} ? 'ativo'">
            Manutenção
        </a>

        <a href="/montagem"
            th:classappend="${pagina == 'montagem'} ? 'ativo'">
            Montagem
        </a>

        <a href="/statusdeservico"
            th:classappend="${pagina == 'statusdeservico'} ? 'ativo'">
            Status de Serviço
        </a>

        <a href="/relatorio"
            th:classappend="${pagina == 'relatorio'} ? 'ativo'">
            Relatório Mensal
        </a>

        <!--/* Só o administrador vê Gerenciar Usuários (comentário do Thymeleaf: não vai para o navegador) */-->
        <div sec:authorize="hasRole('ADM')">
            <hr>

            <a href="/gerenciarusuarios"
                th:classappend="${pagina == 'gerenciarusuarios'} ? 'ativo'">
                Gerenciar Usuários
            </a>
        </div>

        <div sec:authentication="name" class="usuario-logado"></div>

        <!-- Sair por POST: com o CSRF ativo, o logout não aceita GET -->
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-sair">Sair</button>
        </form>
    </div>

</body>
</html>
